[theme]
base = "light"
primaryColor = "#0E6A4E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#E8F4EC"
textColor = "#0F1F1A"
font = "sans serif"

[server]
# headless=true is required on Streamlit Cloud (no browser to auto-open).
# Locally, Streamlit will still print a URL in your terminal — open it
# manually with cmd+click, or run `bash run.sh` which opens it for you.
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
